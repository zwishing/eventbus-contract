name: Publish crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify release tag matches workspace version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[]
            | select(.name == "eventbus-contract")
            | .version
          ')"

          if [[ "$RELEASE_TAG" != "v$workspace_version" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match workspace version v$workspace_version."
            exit 1
          fi
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test Redis Watermill feature
        run: cargo test -p eventbus-redis --features watermill --locked
      - name: Publish packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::The CARGO_REGISTRY_TOKEN repository secret is required."
            exit 1
          fi

          publish_package() {
            local package="$1"
            cargo publish -p "$package" --locked --registry crates-io --dry-run
            cargo publish -p "$package" --locked --registry crates-io
          }

          # Keep internal path dependencies available before their consumers.
          publish_package eventbus-core
          publish_package eventbus-memory
          publish_package eventbus-redis
          publish_package eventbus-contract
